<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surprise 🎉</title>
  <!-- Importation d'une police élégante -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #1e1e4f, #080811);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      perspective: 1000px;
    }

    .card {
      z-index: 2;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 24px;
      max-width: 550px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(123, 97, 255, 0.2);
      animation: popEnter 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    /* Effet d'inclinaison subtil au survol */
    .card:hover {
      transform: translateY(-5px) rotateX(2deg) rotateY(2deg);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(123, 97, 255, 0.4);
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #ffde43, #ff7b90, #63e2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
    }

    p {
      font-size: 1.15em;
      line-height: 1.8;
      color: #e0e0ff;
      font-weight: 400;
    }

    /* Joli bouton pour la musique */
    .audio-btn {
      margin-top: 25px;
      background: linear-gradient(135deg, #6c5ce7, #a8a5ff);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1em;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .audio-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
    }

    .audio-btn.playing {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
    }

    @keyframes popEnter {
      0% { transform: scale(0.6) translateY(50px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .emoji {
      position: absolute;
      top: -50px;
      font-size: 28px;
      animation: fall linear infinite;
      z-index: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .burst {
      position: absolute;
      font-size: 35px;
      animation: burst 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes burst {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(2.5) rotate(180deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- Balise Audio : Remplacez l'URL par votre propre lien de musique si nécessaire -->
<audio id="bg-music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>🎉 Joyeux anniversaire Dr Vicky 🎂</h1>
  <p>
    Une personne exceptionnelle mérite une journée exceptionnelle.
    <br><br>
    Que cette nouvelle année vous apporte réussite, santé et bonheur.
    <br><br>
    Merci pour votre guidance et votre inspiration ✨
  </p>
  <button id="music-toggle" class="audio-btn" onclick="toggleMusic()">Activer la musique 🎵</button>
</div>

<script>
  const emojis = ['🎉','🎂','🎊','✨','💫','🎁','💖','🍾'];

  // Génération de la pluie d'emojis
  function createEmoji() {
    const el = document.createElement('div');
    el.classList.add('emoji');
    el.style.left = Math.random() * window.innerWidth + 'px';
    el.style.animationDuration = (3 + Math.random() * 4) + 's';
    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    document.body.appendChild(el);

    setTimeout(() => el.remove(), 7000);
  }
  setInterval(createEmoji, 250);

  // Explosion d'emojis au centre
  function burst() {
    for (let i = 0; i < 35; i++) {
      const b = document.createElement('div');
      b.classList.add('burst');
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      
      // Points de départ randomisés autour du centre
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 150;
      
      b.style.left = (window.innerWidth / 2 + Math.cos(angle) * distance) + 'px';
      b.style.top = (window.innerHeight / 2 + Math.sin(angle) * distance) + 'px';
      
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1200);
    }
  }
  window.onload = burst;

  // Gestion de la musique
  function toggleMusic() {
    const music = document.getElementById('bg-music');
    const btn = document.getElementById('music-toggle');
    
    if (music.paused) {
      music.play().catch(e => console.log("Lecture bloquée par le navigateur"));
      btn.innerText = "Couper la musique 🔇";
      btn.classList.add('playing');
    } else {
      music.pause();
      btn.innerText = "Activer la musique 🎵";
      btn.classList.remove('playing');
    }
  }
</script>

</body>
</html>
